name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: haras_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build shared package
      run: cd packages/shared && yarn build

    - name: Lint backend
      run: cd apps/backend && yarn lint

    - name: Lint frontend
      run: cd apps/web && yarn lint

    - name: Type check backend
      run: cd apps/backend && yarn typecheck

    - name: Type check frontend
      run: cd apps/web && yarn typecheck

    - name: Test backend
      run: cd apps/backend && yarn test
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/haras_test
        REDIS_URL: redis://localhost:6379
        JWT_SECRET: test-secret
        NODE_ENV: test

    - name: Build backend
      run: cd apps/backend && yarn build

    - name: Build frontend
      run: cd apps/web && yarn build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:3001